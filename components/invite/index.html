<transition name="slide-away">
    <article v-if="visible" class="invite-notif">
        <p>
            <graffiti-actor-to-handle :actor="invite.actor" />
            has invited you to join {{ invite.value.title }}!
        </p>

        <div>
            <button class="accept-btn" @click="handleAccept">Accept</button>

            <button class="decline-btn" @click="handleDecline">Decline</button>
        </div>
    </article>
</transition>
