<link rel="stylesheet" href="style.css" />

<section v-if="!$graffitiSession.value" class="homepage">
    <header class="homepage-header">
        <h1>Group Project Chat</h1>
        <button @click="$graffiti.login()">Log In</button>
    </header>

    <p class="login-message">Please log in to continue.</p>
</section>

<template v-else>
    <section class="homepage">
        <header class="homepage-header">
            <h1>Group Project Chat</h1>
            <button @click="$graffiti.logout($graffitiSession.value)">
                Log Out
            </button>
        </header>

        <main class="homepage-main">
            <p class="homepage-username">
                Hello,
                <graffiti-actor-to-handle
                    :actor="$graffitiSession.value.actor"
                />!
            </p>

            <section v-if="filteredInvites.length > 0" class="invite-container">
                <invite-item
                    v-for="invite in filteredInvites"
                    :key="invite.url"
                    :invite="invite"
                    @accept="acceptInvite"
                    @decline="declineInvite"
                />
            </section>

            <section class="homepage-chats">
                <h2>My Chats</h2>

                <form @submit.prevent="createChat" class="chat-send-bar">
                    <input
                        type="text"
                        v-model="newChatTitle"
                        placeholder="New chat name..."
                    />
                    <button
                        type="submit"
                        :disabled="!newChatTitle.trim() || isCreatingChat"
                    >
                        {{ isCreatingChat ? "Creating..." : "Create Chat" }}
                    </button>
                </form>

                <p v-if="sortedChats.length === 0">
                    No chats yet. Create one above!
                </p>
                <section v-else class="chat-container">
                    <article
                        v-for="chat in sortedChats"
                        :key="chat.url"
                        class="chat-card"
                    >
                        <p>{{ chat.value.title }}</p>

                        <div>
                            <button @click="openChat(chat)" class="open-btn">
                                Enter
                            </button>
                            <button
                                @click="deleteChat(chat)"
                                :disabled="isDeletingChat"
                                class="leave-btn"
                            >
                                Delete
                            </button>
                        </div>
                    </article>
                </section>
            </section>
        </main>
    </section>
</template>
