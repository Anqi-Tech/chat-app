<link rel="stylesheet" href="style.css" />

<section class="chat-tab">
    <section class="chat-tab-main">
        <header>
            <div class="chat-tab-head">
                <h1 class="text-overflow-hidden">{{chatTitle}}</h1>
                <button @click="deleteChat" :disabled="isDeletingChat">
                    {{ isDeletingChat ? "Leaving..." : "Leave Chat" }}
                </button>
            </div>
            <p class="chat-members text-overflow-hidden">{{ memberList }}</p>
        </header>
        <div class="divider"></div>

        <section class="invite-section">
            <transition name="slide-fade" mode="out-in">
                <button
                    v-if="!showInviteForm"
                    key="invite-button"
                    @click="showInviteForm = true; inviteSuccess = false"
                >
                    Invite Someone
                </button>

                <form v-else key="invite-form" @submit.prevent="sendInvite">
                    <div>
                        <label>Person to invite:&nbsp;</label>
                        <input
                            type="text"
                            v-model="inviteeActor"
                            placeholder="handle.graffiti.actor"
                        />
                    </div>

                    <div>
                        <button
                            type="submit"
                            :disabled="!inviteeActor.trim() || isInviting"
                        >
                            {{ isInviting ? "Sending..." : "Send Invite" }}
                        </button>

                        <button type="button" @click="cancelInvite">
                            Cancel
                        </button>
                    </div>

                    <p v-if="inviteError">{{ inviteError }}</p>
                    <p v-if="inviteSuccess">Invitation sent!</p>
                </form>
            </transition>
        </section>
        <div class="divider"></div>

        <section class="chat-tab-messages">
            <p v-if="messagesLoading">Loading messages...</p>
            <chat-message
                v-else-if="sortedMessages.length > 0"
                v-for="msg in sortedMessages"
                :key="msg.url"
                :msg="msg"
                @delete="deleteMessage"
            />
            <p v-else>No messages yet. Say something!</p>
        </section>

        <form @submit.prevent="sendMessage" class="chat-send-bar">
            <input
                type="text"
                v-model="myMessage"
                placeholder="Type a message..."
                :disabled="isSendingMessage"
            />
            <button
                type="submit"
                :disabled="!myMessage.trim() || isSendingMessage"
            >
                {{ isSendingMessage ? "Sending..." : "Send" }}
            </button>
        </form>
    </section>
</section>
