<article class="invite-notif">
    <p>
        <graffiti-actor-to-handle :actor="invite.actor" /> has invited you to
        join {{ invite.value.title }}!
    </p>
    <div>
        <button @click="$emit('accept', invite)" class="accept-btn">
            Accept
        </button>
        <button @click="$emit('decline', invite)" class="decline-btn">
            Decline
        </button>
    </div>
</article>
